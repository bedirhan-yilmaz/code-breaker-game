services:
  server:
    build: .
    image: code-breaker-game
    container_name: code-breaker-game-server
    command: ["server"]
    ports:
      - "8080:8080"

  client:
    image: code-breaker-game
    entrypoint: ["/app/server", "client", "server:8080"]
    stdin_open: true   # docker run -i
    tty: true          # docker run -t
    depends_on:
      - server
    # No container_name — allows multiple instances via `docker compose run client`
